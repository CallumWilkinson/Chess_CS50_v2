name: Deploy Node.js app to Azure Web App - multiplayer-chess

on:
  push:
    branches: [server-side-refactor]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify start script
        run: node -e "const p=require('./package.json'); if(!p.scripts?.start){throw new Error('Missing start script')}"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: multiplayer-chess
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: .
