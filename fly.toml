# fly.toml app configuration file generated for chess-cs50-v2 on 2025-11-04T12:13:26+11:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'chess-cs50-v2'
primary_region = 'syd'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

[[http_service.checks]]
  interval = "30s"
  timeout  = "5s"
  method   = "GET"
  path     = "/health"

