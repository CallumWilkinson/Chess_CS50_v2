<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function redirectToWelcomeIfNeeded() {
        try {
          const key = 'pendingGameSession';
          const hasPending = window.sessionStorage && window.sessionStorage.getItem(key);
          if (!hasPending) {
            window.location.replace('welcome.html');
          }
        } catch (error) {
          window.location.replace('welcome.html');
        }
      })();
    </script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="current-turn-container" data-testid="game-status-container">
      <h1 id="current-turn-heading" data-testid="turn-banner">Current Turn</h1>
      <p id="current-turn-contents" data-testid="game-status"></p>
    </div>
    <canvas
      id="chessBoard"
      width="640"
      height="640"
      data-testid="board-container"
      data-black-pieces-on-bottom="true"
    ></canvas>
    <script type="module" src="./main.js"></script>
  </body>
</html>
